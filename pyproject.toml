[project]
name = "rhetoric-corpus"
version = "0.1.0"
description = "Local multi-country corpus of official and state-media rhetoric, with full-text search."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.7.22",
    "cryptography>=50.0.2",
    "huggingface-hub>=1.0",
    "pandas>=2.2",
    "protobuf>=7.36.2",
    "pyarrow>=17",
    "pymorphy3>=2.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "snowballstemmer>=2.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "pytest>=8",
]

[tool.uv]
package = false

# Linux (the nightly GitHub Actions runner) gets CPU-only torch wheels (no CUDA libraries: ~5 GB less on disk);
# macOS keeps the PyPI wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
