
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>一见·读懂总书记的丰收祝愿</title>
</head><body><img src="https://rs2.huanqiucdn.cn/huanqiu/image/www/common/200.jpg" style="display:none;"><div id="config_page" style="display:none;">/csr-component/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="visibility:hidden;height:0; overflow:hidden;"><div id="csr_topheader_ad">7003383</div><div id="csr_bottomheaderl_ad">7005136</div><div id="csr_bottomheaderr_ad">7005137</div><!--<cs-control data-src="controls/csr_article_ad/csr_article_ad"></cs-control>--><article><textarea class="article-aid">4TTaoSTxMLp</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">一见·读懂总书记的丰收祝愿</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-catnode">/e3pmh1nnq/e3pn60p0i</textarea><textarea class="article-content"><article><section data-type="rtext"><p>金秋十月，礼赞共和国的时节。</p><p>天安门广场上，“祝福祖国”巨型花篮表达着对祖国繁荣昌盛的美好祝愿。篮内选取了代表美好寓意的十五种花卉和五种水果，象征奋进“十五五”的光明前景。</p><p>花团锦簇，累累硕果，神州大地又一次迎来丰收的景象。</p><p>丰收是什么？</p><p>是仓廪实、岁安康，是缀满枝头缕缕果香，亦是对耕耘者的褒奖。</p><p>“努力让广大农民生活更加幸福美好”。前不久，“十五五”时期首个“中国农民丰收节”到来之际，习近平总书记的节日祝贺和诚挚问候如约而至。</p><p>一季丰收，一份牵挂。</p><p><i class="pic-con"><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/58255673a7a16b90f4d6cf0de5bd284c.png?imageView2/2/w/1260" /></i></p><p>习近平总书记始终关心农业、惦念农村、心系农民，多次以农作物为喻，祝乡亲们的生活——“像石榴果一样红红火火”“像甘蔗一样甜蜜”“像苹果一样红红火火”“像花儿一样美”“像金柚一样又甜又美”……</p><p>丰收祝愿饱含“三农”深情，蕴含推进乡村全面振兴的深谋远虑。</p><p>发展与安全，祝愿里有战略考量。</p><p>“除了种甘蔗，平常还有其他收入吗？”“祝愿乡亲们的生活像甘蔗一样甜蜜！”2023年12月，八桂大地，甘蔗林里，习近平总书记同蔗农亲切交流。</p><p>一声关怀、一句祝语，指向同一关切——如何让乡亲们过上更加幸福美好的生活？</p><p>“探索建立更加稳定的利益联结机制，让广大农民共享农村改革和发展成果。”总书记指方向、道方法。</p><p>农事，亦国事。发展好强农富农的甜蜜事业，还有更深一层的考量。</p><p>“守好全国人民的‘糖罐子’”，一根甘蔗，一头连着高质量发展，一头连着高水平安全。</p><p>“农业生产布局关乎发展与安全。”小麦、水稻、大豆、玉米……到各地考察，习近平总书记“都要看看我们国家规划布局上有代表性的产品”。一项项各具特色的农业产业、一次次沉甸甸的收获，是幸福生活的坚实底气，也是国家发展的战略依托。</p><p>因地制宜，祝愿里有富民方法。</p><p>2025年3月，彩云之南，玫瑰花种植大棚中留下温情一幕。</p><p>“都是住在附近吗”“收入怎么样”“在这里种花，心情很好吧”……问远近、算增收、谈感受，习近平总书记祝愿大家的生活“像花儿一样美”。</p><p>“美丽产业”何以成为造福群众的“幸福产业”？</p><p>“各地资源禀赋、基础条件等不同，抓产业转型升级要从实际出发，遵循经济规律，突出自身特色。”</p>
              <adv-loader __attr__inner="7004636" __attr__style="width: auto;position: relative;float: left;border: 1px solid #ebebeb; padding: 20px;overflow: hidden;margin: 10px 30px 40px 0;"></adv-loader>
            <p>产业振兴是乡村振兴的重中之重，也是实际工作的切入点。总书记曾指出，各地推动产业振兴，要把“土特产”这3个字琢磨透。</p><p>柞水木耳、大同黄花、茂名荔枝……习近平总书记近年来关心的“土特产”，蕴藏着推动乡村振兴的密码——神州大地幅员辽阔，风土人情千村千面，乡村发展产业要因地制宜、各展其长，走适合自己的振兴道路，寻找叩开富民大门的专属钥匙。</p><p>实干为要，祝愿里有殷殷嘱托。</p><p>岁物丰成，大地情深。</p><p>105年前，建党之初，为人民谋幸福就写在中国共产党人的史册里。“让人民过上好日子”，朴素却深刻的道理，习近平总书记用脚步一次次丈量。</p><p>“日子过得像金柚一样又甜又美”，2025年11月，广东梅州金柚林，见证总书记对乡亲们的美好祝愿，也记录下谆谆嘱托——“党和政府要继续加强对老区的政策扶持，老区广大干部群众要齐心协力、奋发图强。”</p><p>“始终把保障农民利益放在第一位”“持续为基层减负，让村干部有更多时间和精力服务群众、推动发展”“心往一处想、劲往一处使、汗往一处流，共同把乡亲们的事情办好”……赴农村地区考察，总有一份叮嘱让人温暖。</p><p>好日子是干出来的。乡村振兴，关键在人、关键在干。</p><p>对乡亲们的丰收寄望，也饱含对基层干部的实干寄语。培养造就一支懂农业、爱农村、爱农民的“三农”工作队伍，党的“三农”事业才能获得稳固基础和坚强支撑。</p><p>“各级党委和政府要认真贯彻党中央决策部署，扎实推进乡村全面振兴，提高强农惠农富农政策效能，着力提升农业综合生产能力和质量效益，拓宽农民增收致富渠道”……</p><p>新程浩荡，沃野迎风。</p><p>“十五五”时期是基本实现农业农村现代化的关键时期。丰收的祝愿穿越岁序轮转，激荡在广袤田畴之间，正化为农业农村现代化的澎湃动能。</p><p>策划：杜尚泽、彭俊</p><p>统筹：黄超</p><p>撰文：祁嘉润</p><p>海报：田兴洲</p><p>编辑：王靖远</p><p>校检：熊捷</p></section></article></textarea><textarea class="article-time">1791112175453</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：李莹莹</textarea><textarea class="article-source-name"><a href="https://www.peopleapp.com/column/30053275497-500007726035" >人民日报客户端</a></textarea><textarea class="article-ext-xtime">1791112175453</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">2</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"liyingying@huanqiu.com","name":"李莹莹"}</textarea></article><xpeng id="7004636"></xpeng>
