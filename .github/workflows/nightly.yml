# Nightly collection + publish. State lives in the PRIVATE Hugging Face dataset wallabee1/rhetoric-corpus-store
# (scripts/store_sync.py); the public site data goes, sealed, to wallabee1/rhetoric-search-data. Nothing collected is
# written to this (public) repository or to the public Actions log: collector output goes to logs/ci/ in the store.
name: nightly

on:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC daily; Sundays also run the weekly maintenance steps
  workflow_dispatch:
    inputs:
      collect_minutes:
        description: "Global collection budget (minutes)"
        default: "70"
      skip_chains:
        description: "Comma list of collector chains to skip (see scripts/ci_collect.py --list)"
        default: ""
      publish:
        description: "Upload the sealed search + trends data to the public HF data repo"
        type: boolean
        default: true
      weekly:
        description: "Also run the weekly steps (full semantic pass, squash Hub history)"
        type: boolean
        default: false

concurrency:
  group: rhetoric-corpus-store    # one writer of the store at a time; a queued run waits, never overlaps
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                  # only to keep the schedule enabled (public repos idle for 60 days lose it)

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub-hosted maximum
    defaults:
      run:
        shell: bash   # = bash -eo pipefail: a failing command before | tail still fails the step
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RHETORIC_TIER_PASSWORD: ${{ secrets.RHETORIC_TIER_PASSWORD }}
      SEM_DEVICE: cpu
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      COLLECT_MINUTES: ${{ inputs.collect_minutes || '70' }}
      COLLECT_SKIP: ${{ inputs.skip_chains || '' }}
    steps:
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
                      /opt/microsoft /opt/google /usr/lib/jvm || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
          # 16 GB RAM runners: the 1.8M-document site build died mid-upload on 2026-10-06 (runner lost, exit 143).
          # Swap on the spare disk keeps a memory peak from killing the runner.
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -g | head -3

      - uses: actions/checkout@v4

      - name: Weekly?
        id: when
        run: |
          if [ "$(date -u +%u)" = 7 ] || [ "${{ inputs.weekly }}" = true ]; then echo "weekly=true" >> "$GITHUB_OUTPUT"; else echo "weekly=false" >> "$GITHUB_OUTPUT"; fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (CPU-only torch)
        run: uv sync --frozen --no-dev --python 3.13

      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: index/semantic/models
          key: sem-models-${{ hashFiles('scripts/semantic/config.py') }}
          restore-keys: sem-models-

      - name: Pull store (state, id indexes, index; only the document parts the index has not seen)
        id: pull
        timeout-minutes: 60   # 14 GB index + new parts took 38 min on 2026-10-05
        run: uv run --no-sync python scripts/store_sync.py pull

      - name: Collect
        id: collect
        if: steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 115
        run: uv run --no-sync python scripts/ci_collect.py --budget $(( COLLECT_MINUTES * 60 ))

      - name: Seal collected documents
        id: seal
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        # Segmented store (layout 2): the collected lines become one verified part in the store + state/ids; the
        # part stays under docs-parts/ for the index build. A no-op while the store is still layout 1.
        run: uv run --no-sync python scripts/store_sync.py seal --keep-parts 2>&1 | tail -3

      - name: Build index
        id: index
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --no-sync python scripts/build_index.py 2>&1 | tail -5

      - name: Push collected documents (early, so a later timeout never loses them)
        id: pushdocs
        if: always() && steps.pull.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          uv run --no-sync python scripts/store_sync.py seal --keep-parts 2>&1 | tail -2
          uv run --no-sync python scripts/store_sync.py push --only docs,state 2>&1 | tail -3

      - name: Semantic layer (incremental)
        id: semantic
        if: always() && steps.index.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          # Hard cap (55 min) so the job always reaches publish + store push inside GitHub's 6 h limit; stages resume
          # where they stopped on the next run, so a large backlog is worked off over several nights.
          # Nightly = score new documents only. Retraining the tone model (teacher/train/active stages) runs the large
          # NLI teacher and is far too slow on CPU runners: do it manually on a fast machine. Embed and score are
          # time-boxed and resume where they stopped on the next run.
          if [ "${{ steps.when.outputs.weekly }}" = true ]; then B="--budget 2700"; else B="--budget 1500"; fi
          timeout 55m uv run --no-sync python -m scripts.semantic.run --stage sync,targets,embed,score,topics,trends,echo,brief $B 2>&1 \
            | sed '/Loading weights/d' | tail -40

      - name: Trends data
        id: trends
        if: always() && steps.index.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: uv run --no-sync python publish/build_trends.py

      - name: Sealed site data to Hugging Face
        id: publish
        if: always() && steps.trends.outcome == 'success' && (github.event_name == 'schedule' || inputs.publish)
        continue-on-error: true
        timeout-minutes: 150   # 1.84M docs: >90 min on 2026-10-07 (was 58-70 min at 1.4-1.65M); see memory note in build
        run: |
          free -g | head -3
          /usr/bin/time -v uv run --no-sync python publish/build_hf_data.py --trends staging/trends --upload 2>&1 \
            | grep -vE '^\s+(Average|Socket|Signals|Swaps|File system|Involuntary|Voluntary|Page size|Minor|Exit status)' | tail -40

      - name: Push store (always, so collected documents are never lost)
        id: push
        if: always() && steps.pull.outcome == 'success'
        timeout-minutes: 40
        run: |
          for i in 1 2 3; do
            uv run --no-sync python scripts/store_sync.py seal --keep-parts \
              && uv run --no-sync python scripts/store_sync.py push && exit 0
            echo "push attempt $i failed; retrying in 60 s"; sleep 60
          done
          exit 1

      - name: Save model cache
        if: always() && steps.semantic.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: index/semantic/models
          key: sem-models-${{ hashFiles('scripts/semantic/config.py') }}-${{ github.run_id }}

      - name: Weekly maintenance (squash Hub history)
        if: always() && steps.push.outcome == 'success' && steps.when.outputs.weekly == 'true'
        continue-on-error: true
        run: |
          uv run --no-sync python scripts/store_sync.py squash
          uv run --no-sync python -c "from huggingface_hub import HfApi; HfApi().super_squash_history('wallabee1/rhetoric-search-data', repo_type='dataset', commit_message='squash history')"

      - name: Keep the schedule enabled
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nightly.yml/enable"

      - name: Summary
        if: always()
        env:
          OUTCOMES: >-
            pull=${{ steps.pull.outcome }} collect=${{ steps.collect.outcome }} seal=${{ steps.seal.outcome }} index=${{ steps.index.outcome }}
            semantic=${{ steps.semantic.outcome }} trends=${{ steps.trends.outcome }} publish=${{ steps.publish.outcome }}
            push=${{ steps.push.outcome }}
        run: |
          {
            echo "### Steps"; echo; for o in $OUTCOMES; do echo "- ${o%%=*}: **${o#*=}**"; done; echo
            echo "### Disk"; echo; echo '```'; df -h / | tail -1
            du -sh .venv docs docs-parts state index/corpus.sqlite index/semantic index/semantic/models staging 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.push.outcome }}" = success ] || { echo "store push did not succeed"; exit 1; }
